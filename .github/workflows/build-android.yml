name: Build Android APK

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  PROJECT_NAME: "MalamTerakhir"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Godot Binary & Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Download & Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          # Download Godot Linux binary
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          rm Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip

          # Download Export Templates
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          rm -rf templates Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz

      - name: Setup Godot Editor Settings (Android SDK Path)
        run: |
          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Generate Debug Keystore
        run: |
          keytool -keyalg RSA -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore debug.keystore \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 \
            -deststoretype pkcs12

      - name: Import Godot Project (Headless)
        run: |
          godot --headless --editor --quit || true
          sleep 5

      - name: Build Debug APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/${PROJECT_NAME}-debug.apk

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_USER: ${{ secrets.RELEASE_KEYSTORE_USER }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
            # Update export_presets.cfg with release keystore
            sed -i 's|keystore/release=""|keystore/release="release.keystore"|' export_presets.cfg
            sed -i "s|keystore/release_user=\"\"|keystore/release_user=\"$RELEASE_KEYSTORE_USER\"|" export_presets.cfg
            sed -i "s|keystore/release_password=\"\"|keystore/release_password=\"$RELEASE_KEYSTORE_PASS\"|" export_presets.cfg
            godot --headless --export-release "Android" build/${PROJECT_NAME}-release.apk
          else
            echo "⚠️ Release keystore not configured. Skipping release build."
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-debug-apk
          path: build/${{ env.PROJECT_NAME }}-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-release-apk
          path: build/${{ env.PROJECT_NAME }}-release.apk
          retention-days: 90
          if-no-files-found: ignore
